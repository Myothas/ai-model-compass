apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-model-compass
  labels:
    app.kubernetes.io/name: ai-model-compass
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-model-compass
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 3000
          protocol: TCP
